name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Frontend Build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package.json'

      - name: Build React SPA Frontend
        run: |
          cd web
          npm install
          npm run build
          cd ..

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Standalone Zero-CGO Binaries
        env:
          CGO_ENABLED: '0'
          LDFLAGS: '-s -w'
        run: |
          mkdir -p dist

          # 1. Linux ARM64 (Android Termux / Magisk / SBC)
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/go-streamer-linux-arm64 cmd/server/main.go embed.go

          # 2. Linux ARM 32-bit (Older Pi / Android 32-bit)
          GOOS=linux GOARCH=arm go build -trimpath -ldflags="$LDFLAGS" -o dist/go-streamer-linux-arm cmd/server/main.go embed.go

          # 3. Linux AMD64 (VPS Server / Cloud)
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/go-streamer-linux-amd64 cmd/server/main.go embed.go

          # 4. Windows AMD64
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/go-streamer-windows-amd64.exe cmd/server/main.go embed.go

          # 5. macOS Apple Silicon (Darwin ARM64)
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/go-streamer-darwin-arm64 cmd/server/main.go embed.go

      - name: Package Magisk Module Zip (Android Root)
        run: |
          TAG_NAME="${{ github.ref_name }}"
          MODULE_DIR="build_magisk"
          rm -rf "$MODULE_DIR"
          mkdir -p "$MODULE_DIR/system/bin"

          cp scripts/magisk/module.prop "$MODULE_DIR/module.prop"
          sed -i "s/version=v1.0.0/version=$TAG_NAME/g" "$MODULE_DIR/module.prop"
          cp scripts/magisk/service.sh "$MODULE_DIR/service.sh"
          chmod +x "$MODULE_DIR/service.sh"

          # Use compiled Linux ARM64 binary as the module daemon
          cp dist/go-streamer-linux-arm64 "$MODULE_DIR/system/bin/go-streamer"
          chmod +x "$MODULE_DIR/system/bin/go-streamer"

          (cd "$MODULE_DIR" && zip -r "../dist/go-streamer-magisk-arm64-${TAG_NAME}.zip" .)

      - name: Generate Checksums (SHA256)
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
